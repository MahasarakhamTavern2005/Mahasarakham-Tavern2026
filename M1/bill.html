<script>
function updateDateTime() {
    const now = new Date();

    const options = {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    };

    document.getElementById("datetime").innerHTML =
        now.toLocaleString('th-TH', options);
}

updateDateTime();

<script>

function confirmBill(){

    let table = document.getElementById("tableNo").value;

    if(table==""){
        alert("กรุณากรอกเลขโต๊ะ");
        return;
    }

    // ซ่อนปุ่มก่อนแคป (ถ้าต้องการ)
    const btn = document.querySelector(".btn-success");
    btn.style.display = "none";

    html2canvas(document.querySelector(".container"),{

        scale:3,
        useCORS:true,
        backgroundColor:"#1b1b1b"

    }).then(function(canvas){

        // แสดงปุ่มกลับ
        btn.style.display = "inline-block";

        let link = document.createElement("a");

        link.download = "โต๊ะ-"+table+".png";

        link.href = canvas.toDataURL("image/png");

        link.click();

        alert("บันทึกภาพเรียบร้อย");

    });

}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

    let html="";
    let total=0;

    cart.forEach((item,index)=>{

        if(!item.qty){
            item.qty=1;
        }

        total += item.price * item.qty;

        html += `
        <tr>

            <td>${item.name}</td>

            <td>

                <button class="btn btn-danger btn-sm"
                onclick="minus(${index})">-</button>

                <span class="mx-2">${item.qty}</span>

                <button class="btn btn-success btn-sm"
                onclick="plus(${index})">+</button>

            </td>

            <td>${item.price}</td>

            <td>${item.price * item.qty}</td>

            <td>

                <button class="btn btn-warning btn-sm"
                onclick="removeItem(${index})">

                ลบ

                </button>

            </td>

        </tr>
        `;

    });

    document.getElementById("list").innerHTML=html;

    document.getElementById("total").innerHTML=total;

    localStorage.setItem("cart",JSON.stringify(cart));

}

function plus(i){

    cart[i].qty++;

    renderCart();

}

function minus(i){

    if(cart[i].qty>1){

        cart[i].qty--;

    }

    renderCart();

}

function removeItem(i){

    cart.splice(i,1);

    renderCart();

}

renderCart();

</script>
